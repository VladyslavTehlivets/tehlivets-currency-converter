<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Sign in · Currency Converter · tehlivets-currency-converter-3</title>
<style>
@font-face { font-family: "Bricolage Grotesque"; src: url("../../../web/public/fonts/bricolage-grotesque-latin-500-700.woff2") format("woff2"); font-weight: 500 700; font-display: swap; }
@font-face { font-family: "Instrument Sans"; src: url("../../../web/public/fonts/instrument-sans-latin-400-600.woff2") format("woff2"); font-weight: 400 600; font-display: swap; }
@font-face { font-family: "Google Sans"; src: url("brand/google-sans-medium-latin.woff2") format("woff2"); font-weight: 500; font-display: swap; }

:root {
  --color-primary: #207553;
  --color-on-primary: #ffffff;
  --color-primary-container: #dfece2;
  --color-on-primary-container: #1c6247;
  --color-surface: #f4f1eb;
  --color-on-surface: #222528;
  --color-surface-container: #faf9f5;
  --color-on-surface-variant: #595e60;
  --color-error: #963c34;
  --color-error-container: #f5e2dd;
  --color-field: #eeefea;
  --color-placeholder: #e5e8df;
  --color-rule: #d4d8d077;
  --color-glass: #ffffffa8;

  --color-provider-door: #FFFFFF;
  --color-provider-door-edge: #747775;
  --color-provider-door-ink: #1F1F1F;
  --color-provider-door-pressed: #F2F2F2;
  --font-provider-door: "Google Sans", "Instrument Sans", sans-serif;

  --font-display: "Bricolage Grotesque", sans-serif;
  --font-body: "Instrument Sans", sans-serif;
  --text-page-title: clamp(34px, 4vw, 52px);
  --text-title: 22px;
  --text-brand: 21px;
  --text-lead: 18px;
  --text-label-lg: 14px;
  --text-caption: 13px;
  --text-fine: 12px;
  --text-eyebrow: 11px;
  --radius-xs: 10px;
  --radius-sm: 17px;
  --radius-note: 18px;
  --radius-md: 27px;
  --radius-lg: 32px;
  --radius-xl: 39px;
  --radius-bezel: var(--radius-xl);
  --radius-core: var(--radius-lg);
  --spacing-bezel: 7px;
  --spacing-card: 30px;
  --shadow-bezel: inset 0 1px 0 #fffe, 0 22px 62px -30px #343b3029;
  --shadow-core: inset 0 1px 0 #fff, inset 0 -1px 0 #22252806;
  --shadow-island: inset 0 1px 0 #fff, 0 8px 32px #343b3010;
  --shadow-cta: inset 0 1px 1px #fff9, 0 4px 12px #30362b0c;
  --shadow-cta-quiet: inset 0 1px 0 #fff, 0 2px 10px #27362e08;
  --shadow-glyph: inset 0 1px 1px #fff7;
  --shadow-field: inset 0 2px 4px #30362b07, inset 0 -1px 0 #fff;
  --shadow-highlight: inset 0 1px 0 #fff;
  --ease-spring: cubic-bezier(0.22, 1, 0.36, 1);
  --duration-control: 450ms;
  --gradient-bezel: linear-gradient(145deg, #fff9, #dadcd680);
  --gradient-core: linear-gradient(145deg, #ffffffec, #faf9f5df);
  --gradient-mesh: radial-gradient(ellipse at 83% 8%, var(--color-primary-container), transparent 48%), radial-gradient(ellipse at 12% 74%, #e4e6e4a0, transparent 54%);
  --gradient-halo: radial-gradient(ellipse, var(--color-primary-container), transparent 68%);
}
@media (max-width: 1023px) { :root { --spacing-card: 24px; } }
@media (max-width: 767px) {
  :root { --text-page-title: 37px; --text-brand: 19px; --text-lead: 17px; --radius-bezel: 33px; --radius-core: var(--radius-md); --spacing-bezel: 6px; }
}

* { box-sizing: border-box; margin: 0; }
html { -webkit-text-size-adjust: 100%; }
body { min-height: 100dvh; background: var(--color-surface); color: var(--color-on-surface); font: 400 16px/1.55 var(--font-body); }
h1, h2 { font-family: var(--font-display); font-weight: 600; line-height: 1.07; letter-spacing: -0.045em; text-wrap: balance; }
p { color: var(--color-on-surface-variant); }
a, button, input { touch-action: manipulation; -webkit-tap-highlight-color: transparent; font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--color-on-primary-container); outline-offset: 4px; }
.reach { position: relative; }
.reach::after { content: ""; position: absolute; top: 50%; left: 50%; width: 44px; height: 44px; min-width: 100%; min-height: 100%; transform: translate(-50%, -50%); }

.mesh { position: fixed; inset: 0; z-index: -1; background: var(--gradient-mesh); pointer-events: none; }
.shell { margin: 0 auto; max-width: 1160px; padding: max(16px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(36px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left)); }
@media (min-width: 768px) { .shell { padding: 24px 28px 64px; } }
@media (min-width: 1024px) { .shell { padding: 24px 44px 64px; } }

.site-header { margin: 0 auto 46px; display: flex; align-items: center; justify-content: space-between; gap: 10px; border-radius: 9999px; background: var(--color-glass); padding: 8px 10px 8px 16px; box-shadow: var(--shadow-island); }
@media (min-width: 768px) { .site-header { width: fit-content; justify-content: flex-start; gap: 20px; padding: 10px 12px 10px 22px; margin-bottom: 72px; } }
@media (min-width: 1024px) { .site-header { gap: 30px; } }
.brand { display: flex; align-items: center; gap: 10px; font: 600 var(--text-brand) var(--font-display); letter-spacing: -0.04em; white-space: nowrap; text-decoration: none; }
.brand-tile { display: inline-grid; place-items: center; width: 31px; height: 31px; border-radius: var(--radius-xs); background: var(--color-primary); color: var(--color-on-primary); font-size: 18px; box-shadow: var(--shadow-highlight); }
.menu-toggle { display: inline-grid; place-items: center; width: 44px; height: 44px; border: 0; border-radius: 9999px; background: var(--color-field); box-shadow: var(--shadow-highlight); }
.nav { display: none; font-size: var(--text-caption); gap: 24px; }
.nav a { text-decoration: none; white-space: nowrap; }
.nested-cta { display: none; align-items: center; justify-content: space-between; gap: 22px; min-height: 50px; padding: 6px 6px 6px 22px; border-radius: 9999px; background: var(--color-primary); color: var(--color-on-primary); font-weight: 600; font-size: var(--text-label-lg); text-decoration: none; box-shadow: var(--shadow-cta); }
.nested-cta span { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 9999px; background: #ffffff57; box-shadow: var(--shadow-glyph); font-size: 20px; }
@media (min-width: 768px) { .menu-toggle { display: none; } .nav { display: flex; } .nested-cta { display: inline-flex; } }

.hero { display: grid; align-items: center; gap: 44px; padding: 16px 0 40px; }
@media (min-width: 768px) { .hero { grid-template-columns: 1.02fr 1fr; gap: 35px; min-height: 570px; padding: 0 0 100px; } }
@media (min-width: 1024px) { .hero { gap: 70px; } }
.hero > * { min-width: 0; }
.eyebrow { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 22px; border-radius: 9999px; background: #ffffff8c; padding: 7px 13px; font-size: var(--text-eyebrow); font-weight: 600; letter-spacing: 0.13em; text-transform: uppercase; color: var(--color-on-primary-container); box-shadow: var(--shadow-highlight); }
.eyebrow::before { content: ""; width: 6px; height: 6px; border-radius: 9999px; background: var(--color-on-primary-container); }
h1 { font-size: var(--text-page-title); max-width: 15ch; overflow-wrap: anywhere; }
.lede { margin-top: 22px; max-width: 43ch; font-size: var(--text-lead); }
@media (min-width: 768px) { .lede { margin-top: 26px; } }

.halo { position: relative; isolation: isolate; }
.halo::before { content: ""; position: absolute; inset: -12% 0; z-index: -1; background: var(--gradient-halo); pointer-events: none; }
.bezel { border-radius: var(--radius-bezel); background: var(--gradient-bezel); padding: var(--spacing-bezel); box-shadow: var(--shadow-bezel); }
.core { border-radius: var(--radius-core); background: var(--gradient-core); padding: var(--spacing-card); box-shadow: var(--shadow-core); }

.notice { margin-bottom: 18px; border-radius: var(--radius-note); padding: 15px 18px; font-size: var(--text-caption); overflow-wrap: anywhere; }
.notice:focus { outline: none; }
.notice:last-child { margin-bottom: 0; }
.notice strong { display: block; margin-bottom: 2px; font-size: var(--text-label-lg); font-weight: 600; }
.notice p { color: var(--color-on-surface); max-width: none; }
.notice--neutral { background: var(--color-field); }
.notice--neutral strong { color: var(--color-on-surface); }
.notice--trouble { background: var(--color-error-container); }
.notice--trouble strong { color: var(--color-error); }
.notice a { color: var(--color-on-primary-container); font-weight: 600; }

.door { position: relative; display: flex; width: 100%; min-height: 44px; align-items: center; justify-content: center; gap: 10px; padding: 0 12px; border: 1px solid var(--color-provider-door-edge); border-radius: 9999px; background: var(--color-provider-door); color: var(--color-provider-door-ink); font: 500 16px/20px var(--font-provider-door); white-space: nowrap; cursor: pointer; transition: background-color var(--duration-control) var(--ease-spring), transform var(--duration-control) var(--ease-spring); }
.door:hover { background: var(--color-provider-door-pressed); }
.door:active { background: var(--color-provider-door-pressed); border-color: var(--color-provider-door-ink); transform: scale(0.97); }
.door img { width: 20px; height: 20px; }
.door[aria-busy="true"] { cursor: default; }
.spinner { width: 20px; height: 20px; border-radius: 9999px; border: 2px solid color-mix(in srgb, var(--color-provider-door-ink) 25%, transparent); border-top-color: var(--color-provider-door-ink); animation: turn 800ms linear infinite; }
@keyframes turn { to { transform: rotate(1turn); } }
.door-caption { margin-top: 12px; font-size: var(--text-caption); }

.test-door { margin-top: 24px; border: 1px dashed var(--color-on-surface-variant); border-radius: var(--radius-core); background: var(--color-surface-container); padding: var(--spacing-card); }
.dev-badge { display: inline-flex; align-items: center; gap: 8px; border-radius: 9999px; background: var(--color-placeholder); padding: 7px 13px; font-size: var(--text-eyebrow); font-weight: 600; letter-spacing: 0.13em; text-transform: uppercase; color: var(--color-on-surface); }
.dev-badge::before { content: ""; width: 6px; height: 6px; border-radius: 9999px; background: var(--color-on-surface-variant); }
.test-door > p { margin: 10px 0 18px; font-size: var(--text-caption); }
.field { display: grid; gap: 8px; margin-bottom: 20px; }
.field label { font-size: var(--text-caption); font-weight: 600; }
.field input { width: 100%; min-width: 0; min-height: 44px; padding: 12px 16px; border: 1px solid transparent; border-radius: var(--radius-sm); background: var(--color-field); box-shadow: var(--shadow-field); font-size: 16px; }
.field input:focus-visible { background: #fff; outline: 2px solid var(--color-on-primary-container); outline-offset: 2px; }
.field input[aria-invalid="true"] { border-color: var(--color-error); }
.field input[readonly] { opacity: 0.6; }
.form-error { margin: -8px 0 16px; font-size: var(--text-caption); color: var(--color-error); }
.button-muted { display: inline-flex; width: 100%; min-height: 44px; align-items: center; justify-content: center; gap: 8px; padding: 0 16px; border: 0; border-radius: 9999px; background: var(--color-field); color: var(--color-on-surface); font-weight: 600; font-size: 16px; box-shadow: var(--shadow-highlight); cursor: pointer; }
.button-muted:disabled { opacity: 0.6; }
.button-muted .spinner { border-color: color-mix(in srgb, var(--color-on-surface) 25%, transparent); border-top-color: var(--color-on-surface); }

.site-footer { margin-top: 50px; display: flex; flex-direction: column; align-items: flex-start; gap: 20px; border-top: 1px solid var(--color-rule); padding: 30px 0; font-size: var(--text-fine); color: var(--color-on-surface-variant); }
@media (min-width: 768px) { .site-footer { margin-top: 90px; flex-direction: row; align-items: center; justify-content: space-between; } }
.site-footer nav { display: flex; flex-wrap: wrap; gap: 22px; }
.site-footer a { text-decoration: none; white-space: nowrap; }
.site-footer a[aria-current="page"] { color: var(--color-on-primary-container); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.gallery { display: flex; flex-wrap: wrap; gap: 24px; padding: 24px; }
.gallery figure { display: grid; gap: 8px; }
.gallery figcaption { font: 600 13px var(--font-body); }
.gallery iframe { width: 390px; height: 844px; border: 1px solid var(--color-rule); border-radius: 12px; background: var(--color-surface); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-iteration-count: 1 !important; transition: none !important; }
}
</style>
</head>
<body>
<div id="root"></div>
<script>
const SCENES = {
  "idle": { note: "Signed out. One Google door." },
  "redirecting": { note: "Door pressed. Busy until the browser leaves.", busy: true },
  "cancelled": { note: "?refused=cancelled&door=google", notice: ["neutral", "status", "You cancelled at Google", "Nothing was shared with Currency Converter. Continue whenever you are ready."] },
  "did-not-finish": { note: "state-mismatch, token-for-another-client, or an unknown code", notice: ["trouble", "alert", "That sign-in did not finish", "A sign-in must finish in the browser that started it, within ten minutes. Start again below."] },
  "email-unverified": { note: "?refused=email-unverified&door=google", notice: ["trouble", "alert", "Google has not verified this account's email", "Continue with a Google account whose email is verified."] },
  "not-invited": { note: "?refused=not-invited&door=google", notice: ["trouble", "alert", "This Google account cannot sign in here", "Continue with another Google account."] },
  "provider-unavailable": { note: "?refused=provider-unavailable&door=google", notice: ["trouble", "alert", "Google is not answering", "Try again in a minute."] },
  "no-provider-door": { note: "http mirror on dev. No door can work here.", noDoor: true, testDoor: "empty" },
  "test-door": { note: "https dev with the dev flag set", testDoor: "empty" },
  "test-door-signing-in": { note: "Test door submitted", testDoor: "busy" },
  "test-door-refused": { note: "Test door refused", testDoor: "refused" },
}

const params = new URLSearchParams(location.search)
const sceneId = params.get("scene")

const header = `
<header class="site-header">
  <a class="brand reach" href="#"><span class="brand-tile" aria-hidden="true">c</span>Currency Converter</a>
  <button class="menu-toggle" type="button" aria-label="Menu" aria-expanded="false"><span aria-hidden="true">☰</span></button>
  <nav class="nav" aria-label="Primary"><a class="reach" href="#">Convert</a><a class="reach" href="#">Rates</a><a class="reach" href="#">How it works</a></nav>
  <a class="nested-cta" href="#">Explore<span aria-hidden="true">↗</span></a>
</header>`

const footer = `
<footer class="site-footer">
  <span>Currency Converter · Made with care.</span>
  <nav aria-label="Footer"><a class="reach" href="#">Convert</a><a class="reach" href="#">Rates</a><a class="reach" href="#">How it works</a><a class="reach" href="#" aria-current="page">Sign in</a></nav>
</footer>`

const googleMark = `<img src="brand/google-g-light.png" srcset="brand/google-g-light@2x.png 2x, brand/google-g-light@3x.png 3x" alt="">`

function noticeMarkup([tone, role, title, body]) {
  return `<div class="notice notice--${tone}" role="${role}" tabindex="-1"><strong>${title}</strong><p>${body}</p></div>`
}

function doorMarkup(busy) {
  return `
<form method="post" action="/auth/google/start" class="door-form">
  <input type="hidden" name="next" value="/rates">
  <button class="door" type="submit" data-door="google" ${busy ? 'aria-busy="true" disabled' : ""}>
    ${busy ? '<span class="spinner" aria-hidden="true"></span>Opening Google…' : `${googleMark}Continue with Google`}
  </button>
</form>
<p class="door-caption">Google sends you back here when you finish.</p>
<p class="sr-only" aria-live="polite">${busy ? "Opening Google" : ""}</p>`
}

function testDoorMarkup(state) {
  const busy = state === "busy"
  const refused = state === "refused"
  const filled = state !== "empty"
  const invalid = refused ? 'aria-invalid="true" aria-describedby="test-door-error"' : ""
  return `
<section class="test-door" aria-labelledby="test-door-title">
  <span class="dev-badge" id="test-door-title">Dev only</span>
  <p>The test member's door. Production never serves it.</p>
  <form method="post" action="/auth/test/sign-in">
    <div class="field"><label for="test-email">Test member email</label>
      <input id="test-email" name="email" type="email" autocomplete="username" autocapitalize="none" spellcheck="false" ${filled ? 'value="factory-e2e@currency.vtehsol.com"' : ""} ${busy ? "readonly" : ""} ${invalid}></div>
    <div class="field"><label for="test-password">Test member password</label>
      <input id="test-password" name="password" type="password" autocomplete="current-password" ${filled ? 'value="••••••••••••"' : ""} ${busy ? "readonly" : ""} ${invalid}></div>
    ${refused ? '<p class="form-error" id="test-door-error" role="alert">That email and password do not match the test member.</p>' : ""}
    <button class="button-muted" type="submit" ${busy ? 'aria-busy="true" disabled' : ""}>${busy ? '<span class="spinner" aria-hidden="true"></span>Signing in…' : "Sign in as the test member"}</button>
  </form>
</section>`
}

function sceneMarkup(scene) {
  const noDoorNotice = scene.noDoor
    ? noticeMarkup(["neutral", "status", "Google sign-in needs the secure address", "This copy of Currency Converter runs on a local address. Google cannot send you back to it."])
    : ""
  const stack = scene.noDoor ? noDoorNotice : `${scene.notice ? noticeMarkup(scene.notice) : ""}${doorMarkup(scene.busy)}`
  return `
<div class="mesh" aria-hidden="true"></div>
<div class="shell">
  ${header}
  <main id="main" tabindex="-1">
    <section class="hero">
      <div>
        <span class="eyebrow">Your account</span>
        <h1>Sign in to Currency Converter</h1>
        <p class="lede">Use your Google account. Worksheets still open by their own key, signed in or not.</p>
      </div>
      <div>
        <div class="halo"><div class="bezel"><div class="core">${stack}</div></div></div>
        ${scene.testDoor ? testDoorMarkup(scene.testDoor) : ""}
      </div>
    </section>
  </main>
  ${footer}
</div>`
}

const root = document.getElementById("root")
if (sceneId && SCENES[sceneId]) {
  root.outerHTML = sceneMarkup(SCENES[sceneId])
  document.querySelector(".notice")?.focus()
  document.querySelector(".door-form")?.addEventListener("submit", (event) => {
    event.preventDefault()
    const holder = event.currentTarget.parentElement
    document.querySelector(".notice")?.remove()
    event.currentTarget.outerHTML = doorMarkup(true).split('<p class="door-caption">')[0]
  })
} else {
  root.outerHTML = `<div class="gallery">${Object.entries(SCENES).map(([id, scene]) => `<figure><figcaption>${id} · ${scene.note}</figcaption><iframe title="${id}" src="?scene=${id}"></iframe></figure>`).join("")}</div>`
}
</script>
</body>
</html>
