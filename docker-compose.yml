name: currency-converter

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: worksheets
      POSTGRES_USER: worksheets
      POSTGRES_PASSWORD: worksheets
    ports:
      - "127.0.0.1:5446:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worksheets -d worksheets"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      network: host
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "7070"
      DATABASE_URL: postgresql://worksheets:worksheets@postgres:5432/worksheets
    ports:
      - "10.13.13.4:7070:7070"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:7070/ | grep -q 'Currency Converter'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
