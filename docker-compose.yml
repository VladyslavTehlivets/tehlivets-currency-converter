name: currency-converter

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: worksheets
      POSTGRES_USER: worksheets
      POSTGRES_PASSWORD: worksheets
    ports:
      - "127.0.0.1:5446:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worksheets -d worksheets"]
      interval: 2s
      timeout: 3s
      retries: 30
